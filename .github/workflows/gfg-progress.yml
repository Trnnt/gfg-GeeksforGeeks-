name: Update GFG Progress

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate GFG progress
        run: |
          python .github/scripts/gfg_progress.py

      - name: Commit updated progress
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/gfg-solution-snake.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GFG progress"
            git push
          fi
